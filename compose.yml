services:

  postgres:
    image: postgres:14.19-trixie
    environment:
      POSTGRES_USER: ${DATABASE_DEFAULT_USER_NAME}
      POSTGRES_PASSWORD: ${DATABASE_DEFAULT_USER_PASSWORD}
      POSTGRES_DB: ${DATABASE_DEFAULT}
    networks: 
      - vaj-network
  
  redis:
    image: redis/redis-stack:7.4.0-v8
    networks:
      - vaj-network

networks:

  vaj-network:
    name: vaj
    external: true
